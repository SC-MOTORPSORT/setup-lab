<style>
:root{
  color-scheme:dark;
  --bg:#09090c; --bg2:#101015; --card:#16161d; --card2:#1d1d26; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#f5f5f7; --mut:#9b9bab; --dim:#6b6b7b;
  --acc:#ff2d78; --acc2:#a855f7; --cy:#22d3ee; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --gold:#facc15;
  --r:18px; --r2:12px; --sh:0 10px 30px rgba(0,0,0,.45);
  --disp:'Barlow Condensed',system-ui,sans-serif; --txt:'Inter',system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--txt);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;background:
  radial-gradient(1200px 500px at 110% -10%,rgba(168,85,247,.14),transparent 60%),
  radial-gradient(900px 400px at -20% 0%,rgba(255,45,120,.12),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,45,120,.18)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px;letter-spacing:.02em}
.h-disp{font-family:var(--disp);font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.mut{color:var(--mut)} .dim{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1} .wrap{flex-wrap:wrap} .center{text-align:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- app shell ---------- */
#app{max-width:760px;margin:0 auto;padding-top:0;padding-bottom:calc(170px + var(--safe-b));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -16px;padding:12px 16px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(9,9,12,.96),rgba(9,9,12,.82));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .ttl{font-family:var(--disp);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;transition:transform .15s,background .2s;position:relative}
.ib:active{transform:scale(.92)} .ib svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--cy);color:#00161b;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;animation:pulse 1.6s infinite}
.logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc));display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-style:italic;color:#fff;box-shadow:0 0 22px rgba(255,45,120,.4)}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:40;display:flex;gap:4px;padding:6px;border-radius:22px;
  background:rgba(22,22,29,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:var(--sh);width:min(440px,calc(100% - 24px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;color:var(--mut);font-size:11px;font-weight:600;transition:all .25s}
.nav button svg{width:22px;height:22px}
.nav button.on{color:#fff;background:linear-gradient(135deg,rgba(255,45,120,.25),rgba(168,85,247,.22))}

/* ---------- section headers ---------- */
.sec{display:flex;align-items:end;justify-content:space-between;margin:22px 0 12px}
.sec h2{margin:0;font-family:var(--disp);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.sec .lnk{font-size:13px;color:var(--acc);font-weight:600}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:14.5px;transition:transform .12s,filter .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,var(--acc),#ff5c93);color:#fff;box-shadow:0 8px 22px rgba(255,45,120,.35)}
.btn.s{background:var(--card2);border:1px solid var(--line2)}
.btn.g{color:var(--mut)} .btn.cy{background:linear-gradient(135deg,#0891b2,var(--cy));color:#00161b}
.btn.d{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn.w{width:100%} .btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(92px + var(--safe-b));z-index:35;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 30px rgba(255,45,120,.45);color:#fff;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(90deg)} .fab svg{width:26px;height:26px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.enter{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
.carcard{position:relative;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);aspect-ratio:16/10;display:block;width:100%;text-align:left;box-shadow:var(--sh);transition:transform .25s}
.carcard:active{transform:scale(.98)}
.carcard .ph,.cover .ph{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s}
.carcard:hover .ph{transform:scale(1.04)}
.carcard .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.85) 100%)}
.carcard .num{position:absolute;right:14px;top:6px;font-family:var(--disp);font-style:italic;font-weight:900;font-size:76px;line-height:1;color:rgba(255,255,255,.92);text-shadow:0 4px 20px rgba(0,0,0,.6);-webkit-text-stroke:1px rgba(255,255,255,.2)}
.carcard .info{position:absolute;left:16px;right:16px;bottom:14px}
.carcard .nm{font-family:var(--disp);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.carcard .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);font-size:12px;font-weight:600;white-space:nowrap}
.pill.acc{background:rgba(255,45,120,.2);color:#ff8fb5}.pill.cy{background:rgba(34,211,238,.16);color:var(--cy)}.pill.ok{background:rgba(34,197,94,.16);color:#86efac}
.pill.warn{background:rgba(245,158,11,.16);color:#fcd34d}.pill.bad{background:rgba(239,68,68,.16);color:#fca5a5}.pill.gold{background:rgba(250,204,21,.16);color:var(--gold)}
.ph-fallback{background:
  radial-gradient(120% 90% at 80% 10%,rgba(168,85,247,.55),transparent 55%),
  radial-gradient(90% 80% at 10% 90%,rgba(255,45,120,.45),transparent 60%),linear-gradient(135deg,#1a1a24,#0d0d12)}

.cover{position:relative;margin:0 -16px;height:220px;overflow:hidden}
.cover .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,12,.2),rgba(9,9,12,.4) 50%,var(--bg) 100%)}
.cover .in{position:absolute;left:16px;right:16px;bottom:12px}
.cover .big{font-family:var(--disp);font-weight:900;font-style:italic;font-size:44px;line-height:.9;text-transform:uppercase}
.cover .edit{position:absolute;right:14px;top:14px}

/* folders */
.folders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.folder{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/1.05;background:var(--card);border:1px solid var(--line);text-align:left;transition:transform .2s}
.folder:active{transform:scale(.96)}
.folder .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.folder .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.88))}
.folder .tab{position:absolute;left:12px;top:12px;width:34px;height:26px;border-radius:7px 7px 7px 7px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:14px}
.folder .in{position:absolute;left:12px;right:12px;bottom:12px}
.folder .nm{font-family:var(--disp);font-weight:800;font-size:21px;line-height:1.02;text-transform:uppercase}
.folder .cnt{position:absolute;right:12px;top:12px;font-family:var(--disp);font-weight:800;font-size:26px;line-height:1}
.folder.base{grid-column:1/-1;aspect-ratio:auto;min-height:118px;border:1px solid rgba(250,204,21,.35);background:linear-gradient(135deg,rgba(250,204,21,.16),rgba(255,45,120,.08) 60%,var(--card))}
.folder.base .in{position:relative;left:auto;right:auto;bottom:auto;padding:16px}
.folder.add{display:grid;place-items:center;border:1.5px dashed var(--line2);background:transparent;color:var(--mut);aspect-ratio:auto;min-height:120px}
.folder.empty{opacity:.55}
.dot-new{position:absolute;right:10px;bottom:10px;width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 0 0 rgba(34,211,238,.7);animation:ping 1.6s infinite}

/* setup cards */
.scard{position:relative;display:block;width:100%;text-align:left;border-radius:18px;padding:14px 14px 14px 18px;background:var(--card);border:1px solid var(--line);overflow:hidden;transition:transform .15s}
.scard:active{transform:scale(.98)}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc,var(--acc))}
.scard .nm{font-weight:700;font-size:16px}
.scard .kp{display:flex;gap:14px;margin-top:10px}
.scard .kp div{display:flex;flex-direction:column}
.scard .kp b{font-family:var(--disp);font-size:20px;font-weight:800;line-height:1}
.scard .kp span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.scard.shared{background:linear-gradient(135deg,rgba(8,145,178,.28),rgba(34,211,238,.10) 50%,var(--card));border-color:rgba(34,211,238,.45);box-shadow:0 0 0 1px rgba(34,211,238,.1),0 10px 30px rgba(8,145,178,.15)}
.scard.shared::before{background:linear-gradient(180deg,var(--cy),#0891b2)}
.ribbon{position:absolute;right:-34px;top:14px;transform:rotate(35deg);background:var(--cy);color:#00161b;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 40px}
.new-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#00161b;background:var(--cy);border-radius:6px;padding:2px 7px;animation:pulse 1.4s infinite}

/* chips & tabs */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);transition:all .2s;white-space:nowrap}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,rgba(255,45,120,.35),rgba(168,85,247,.3))}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:20;margin:0 -16px;padding:10px 16px;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);transition:all .25s}
.tab.on{color:#fff;background:var(--acc);border-color:var(--acc);box-shadow:0 6px 18px rgba(255,45,120,.35)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut);transition:all .2s}
.seg button.on{background:var(--card2);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.05}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.kpi span{display:block;overflow-wrap:normal;word-break:normal}
@media (max-width:430px){.kpis:not([style*="grid-template-columns"]) .kpi{padding:10px 4px}.kpis:not([style*="grid-template-columns"]) .kpi b{font-size:19px;white-space:nowrap}.kpis:not([style*="grid-template-columns"]) .kpi span{font-size:10px;letter-spacing:.03em}}

/* parameter rows */
.prm{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.prm:last-child{border-bottom:0}
.prm .lb{flex:1;min-width:0}
.prm .lb b{display:block;font-size:14px;font-weight:600}
.prm .lb span{font-size:11.5px;color:var(--mut)}
.prm .val{font-family:var(--disp);font-weight:800;font-size:24px;min-width:56px;text-align:right}
.delta{font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;font-family:var(--txt)}
.delta.up{background:rgba(34,197,94,.16);color:#86efac}.delta.dn{background:rgba(239,68,68,.16);color:#fca5a5}.delta.eq{display:none}
.step{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.step button{width:38px;height:38px;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--tx);transition:background .15s}
.step button:active{background:var(--card2)}
.step input{width:62px;border:0;border-radius:0;background:transparent;text-align:center;padding:8px 2px;font-family:var(--disp);font-size:20px;font-weight:800}
.step input:focus{box-shadow:none}
.bump{animation:bump .35s}

/* damper corner */
.corner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.corner h4{margin:0 0 4px;font-family:var(--disp);font-size:18px;text-transform:uppercase;font-weight:800;display:flex;align-items:center;gap:8px}
.clk{margin:12px 0 4px}
.clk .lbl{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--mut);margin-bottom:5px}
.clk .lbl b{color:var(--tx);font-family:var(--disp);font-size:17px}
.bar{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#3b1020,#2a1a3d 50%,#0f2a33)}
.bar i{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,45,120,.35);transform:translateX(-50%);transition:left .35s cubic-bezier(.2,.8,.2,1)}
.bar .ghost{background:transparent;border:2px dashed rgba(255,255,255,.4);box-shadow:none;width:14px;height:14px;top:-2px}
.bar .ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 100%);background-size:var(--tk,10%) 100%;border-radius:6px}
.ends{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:10px;text-transform:uppercase;letter-spacing:.05em}

/* sheet */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);animation:fade .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92vh;overflow:auto;background:var(--bg2);border-top:1px solid var(--line2);border-radius:26px 26px 0 0;
  padding:8px 18px calc(24px + var(--safe-b));animation:up .38s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:6px auto 12px}
.sheet h3{margin:4px 0 10px;font-family:var(--disp);font-size:26px;font-weight:800;text-transform:uppercase}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(98px + var(--safe-b));transform:translateX(-50%);z-index:80;background:#fff;color:#111;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--sh);animation:toast 2.8s forwards;max-width:calc(100% - 32px)}
.toast.e{background:#ef4444;color:#fff}

/* audit */
.au{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.au .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:14px}
.au.crit .ic{background:rgba(239,68,68,.2);color:#fca5a5}.au.aviso .ic{background:rgba(245,158,11,.2);color:#fcd34d}.au.info .ic{background:rgba(34,211,238,.14);color:var(--cy)}
.au b{display:block;font-size:14px}.au p{margin:4px 0 0;font-size:13px;color:var(--mut)}.au .acc{margin-top:6px;font-size:12.5px;color:#fda4c4}

/* engineer */
.fases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fase{padding:14px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center;transition:all .2s}
.fase .e{font-size:26px;display:block;margin-bottom:4px;transition:transform .3s}
.fase b{font-size:12.5px}
.fase.on{border-color:var(--acc);background:linear-gradient(160deg,rgba(255,45,120,.2),var(--card))}
.fase.on .e{transform:scale(1.15) rotate(-6deg)}
.sym{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.sym b{display:block}.sym span{font-size:12.5px;color:var(--mut)}
.chg{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:10px;position:relative}
.chg .pr{position:absolute;right:12px;top:12px;font-family:var(--disp);font-weight:900;font-size:26px;color:rgba(255,255,255,.12)}
.chg > b{font-size:15px;display:block;padding-right:30px}
.chg .ef{font-size:13px;margin-top:6px}.chg .ri{font-size:12.5px;color:#fcd34d;margin-top:4px}
.chg .tp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:800}
.chg.blocked{opacity:.6}
.ck{display:flex;gap:10px;font-size:13.5px;padding:7px 0;color:#d4d4dc}
.ck::before{content:'';flex:none;width:16px;height:16px;border-radius:5px;border:2px solid var(--mut);margin-top:2px}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;padding:0;border:0;border-radius:6px;background:linear-gradient(90deg,#3b82f6,#6b7280 50%,var(--acc))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--acc2);box-shadow:0 2px 10px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--acc2)}
input[type=range].lvl{background:linear-gradient(90deg,#334155,var(--acc))}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 8px}
.login .brand{font-family:var(--disp);font-weight:900;font-style:italic;font-size:54px;line-height:.85;text-transform:uppercase}
.login .brand em{color:var(--acc);font-style:italic}
.pin{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);transition:all .2s}
.pin i.f{background:var(--acc);border-color:var(--acc);box-shadow:0 0 14px rgba(255,45,120,.7);transform:scale(1.1)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad button{height:62px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-family:var(--disp);font-size:28px;font-weight:700;transition:transform .1s,background .2s}
.pad button:active{transform:scale(.92);background:var(--card2)}
.shake{animation:shake .45s}

/* svg diagrams */
.diag{width:100%;display:block}
.diag text{font-family:var(--disp);font-weight:700}
.wheel{transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
.knob{transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-box:fill-box;transform-origin:center}
.body-move{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.needle{transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-origin:100px 100px}

/* ficha (print view) */
.ficha{background:#fff;color:#111;border-radius:16px;padding:14px;font-size:12.5px;overflow-x:auto}
.ficha h1{font-family:var(--disp);font-size:34px;margin:0;text-transform:uppercase;line-height:1}
.ficha table{width:100%;border-collapse:collapse;margin:8px 0 14px}
.ficha th{background:#111;color:#fff;text-align:left;font-size:11px;padding:6px 8px;text-transform:uppercase;letter-spacing:.05em}
.ficha td{border-bottom:1px solid #e5e5e5;padding:6px 8px}
.ficha h2{font-family:var(--disp);font-size:20px;text-transform:uppercase;margin:12px 0 2px;border-left:5px solid var(--acc);padding-left:8px}

.skel{border-radius:16px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
.empty-state{text-align:center;padding:36px 16px;color:var(--mut)}
.empty-state .e{font-size:44px;margin-bottom:8px}
hr.s{border:0;border-top:1px solid var(--line);margin:16px 0}
.avatar{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:20px;flex:none;color:#fff}
.list-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;text-align:left}

.noanim .enter{animation:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25);color:var(--acc)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,211,238,.7)}100%{box-shadow:0 0 0 12px rgba(34,211,238,0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spring{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
@keyframes roll{to{stroke-dashoffset:-60}}
@media (min-width:640px){.folders{grid-template-columns:repeat(3,1fr)}.folder.base{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* v5 · legibilidad y toques */
details.adv{margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}details.adv summary{font-weight:700;cursor:pointer;list-style:none}details.adv summary::before{content:'▸ ';color:var(--acc)}details.adv[open] summary::before{content:'▾ '}
.cbtn{flex:1;min-width:0;min-height:44px;font-size:20px;display:flex;flex-direction:column;align-items:center;line-height:1;padding:6px 4px}.cbtn small{font-size:11px;font-weight:600;color:var(--mut);margin-top:2px}
.tabs{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.chip{min-height:40px}.lnk{padding:10px 0;display:inline-block}
.sheet .xclose{position:sticky;top:0;float:right;width:44px;height:44px;margin:-6px -6px 0 0;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:18px;z-index:2}
.big-act{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.big-act .e{font-size:30px}.big-act b{display:block;font-size:16px}.big-act span{font-size:12.5px;color:var(--mut)}
</style>

</head>
<body>
<!--
  Setup Lab · cargador. Esta página solo contiene la pantalla de entrada.
  La app (ingeniero, análisis AiM, tiempo…) la entrega el servidor DESPUÉS de comprobar móvil y PIN.
-->
<div id="app"><div style="padding-top:120px" class="center"><div class="logo" style="width:64px;height:64px;font-size:28px;border-radius:18px;margin:0 auto">SL</div><div class="small mut" style="margin-top:14px">Cargando…</div></div></div>
<div id="layer"></div>
<script>
(function () {
  var APP = document.getElementById('app'), buf = '', busyOn = false;
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (x) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (x) { return null; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  window.apiFetch = function (req) {
    return fetch(window.SL_API, { method: 'POST', body: JSON.stringify(req), credentials: 'omit', redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('Sin conexión con el servidor (' + r.status + ')'); return r.json(); }, function () { throw new Error('Sin conexión. Comprueba la cobertura y vuelve a intentarlo.'); });
  };
  function api(action, data, token) {
    if (window.SL_API) return window.apiFetch({ token: token, action: action, data: data || {} }).then(function (r) {
      if (r && r.ok) return r.data; var e = new Error(r ? r.msg : 'Error de servidor'); e.code = r && r.error; throw e; });
    return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(function (r) { if (r && r.ok) res(r.data); else { var e = new Error(r ? r.msg : 'Error de servidor'); e.code = r && r.error; rej(e); } })
        .withFailureHandler(function (err) { rej(err instanceof Error ? err : new Error(String(err))); }).api({ token: token, action: action, data: data || {} });
    });
  }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast e'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2900); }
  function pins() { return [0, 1, 2, 3, 4, 5].map(function (i) { return '<i class="' + (i < buf.length ? 'f' : '') + '"' + (i > 3 ? ' style="opacity:.45"' : '') + '></i>'; }).join(''); }
  function loginView() {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
    APP.innerHTML = '<div class="login enter"><div class="row" style="gap:14px;margin-bottom:26px"><div class="logo" style="width:54px;height:54px;font-size:24px;border-radius:16px">SL</div>' +
      '<div><div class="brand">Setup <em>Lab</em></div><div class="mut small" style="letter-spacing:.14em;text-transform:uppercase;margin-top:6px">Carcross · ingeniería de pista</div></div></div>' +
      '<label class="f">Móvil</label><input id="ltel" inputmode="tel" autocomplete="tel" placeholder="600 000 000" value="' + esc(load('sl_tel') || '') + '">' +
      '<label class="f" style="text-align:center;margin-top:20px">PIN</label><div class="pin">' + pins() + '</div>' +
      '<div class="pad">' + keys.map(function (k) { return '<button data-a="pinKey" data-k="' + k + '">' + k + '</button>'; }).join('') +
      '<button data-a="pinDel" style="font-size:20px">⌫</button><button data-a="pinKey" data-k="0">0</button><button data-a="login" style="background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;font-size:19px;text-transform:uppercase">Entrar</button></div>' +
      '<p class="center small mut" style="margin-top:22px">¿Olvidaste el PIN? Pídeselo al administrador del equipo.</p></div>';
  }
  function paint() { var p = APP.querySelector('.pin'); if (p) p.innerHTML = pins(); }
  function onClick(ev) {
    var b = ev.target.closest('[data-a]'); if (!b || window.__SL_LOADED) return; var a = b.getAttribute('data-a');
    if (a === 'pinKey' && buf.length < 6) { buf += b.getAttribute('data-k'); paint(); }
    else if (a === 'pinDel') { buf = buf.slice(0, -1); paint(); }
    else if (a === 'login') doLogin();
  }
  function onKey(ev) {
    if (window.__SL_LOADED || (document.activeElement && document.activeElement.id === 'ltel')) return;
    if (/^\d$/.test(ev.key) && buf.length < 6) { buf += ev.key; paint(); } else if (ev.key === 'Backspace') { buf = buf.slice(0, -1); paint(); } else if (ev.key === 'Enter') doLogin();
  }
  function doLogin() {
    if (busyOn) return; var tel = (document.getElementById('ltel') || {}).value || '';
    if (buf.length < 4) { toast('El PIN tiene 4 a 6 cifras'); return; }
    busyOn = true; APP.querySelector('[data-a="login"]').textContent = '…';
    api('login', { tel: tel, pin: buf }).then(function (r) { store('sl_token', r.token); store('sl_tel', tel); buf = ''; return fetchApp(r.token); })
      .catch(function (err) {
        busyOn = false; buf = ''; var lb = APP.querySelector('[data-a="login"]');
        if (!lb) { loginView(); var t = document.getElementById('ltel'); if (t) t.value = tel; }   // la pantalla se perdió: se rehace con el móvil escrito
        else { lb.textContent = 'Entrar'; paint(); }
        var p = APP.querySelector('.pin'); if (p) { p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); } toast(err.message); });
  }
  /** Pide la app al servidor (solo con sesión válida). Se guarda en este móvil por versión: la siguiente vez arranca al momento. */
  function fetchApp(token) {
    var v = load('sl_bv'), cached = v ? load('sl_bundle') : null;
    return api('bundle', { v: cached ? v : '' }, token).then(function (r) {
      var html = r.same && cached ? cached : r.html;
      if (!html) throw new Error('No se pudo cargar la app');
      if (!r.same) { store('sl_bundle', null); store('sl_bv', null); try { localStorage.setItem('sl_bundle', html); localStorage.setItem('sl_bv', r.v); } catch (x) { store('sl_bundle', null); store('sl_bv', null); } }
      inject(html);
    });
  }
  function inject(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    Array.prototype.slice.call(doc.head.querySelectorAll('style,link')).forEach(function (n) { document.head.appendChild(document.importNode(n, true)); });
    document.removeEventListener('click', onClick); document.removeEventListener('keydown', onKey);
    window.__SL_LOADED = true; window.__SL_DEFER = true; document.body.innerHTML = '';
    Array.prototype.slice.call(doc.body.childNodes).forEach(function (n) {
      if (n.nodeType === 1 && n.tagName === 'SCRIPT') { var s = document.createElement('script'); s.textContent = n.textContent; document.body.appendChild(s); }
      else if (n.nodeType === 1 && n.tagName === 'STYLE') document.head.appendChild(document.importNode(n, true));
      else document.body.appendChild(document.importNode(n, true));
    });
    if (window.__SL_BOOT) window.__SL_BOOT();
  }
  document.addEventListener('click', onClick); document.addEventListener('keydown', onKey);
  var tk = load('sl_token');
  if (!tk) loginView();
  else fetchApp(tk).catch(function (err) {
    if (err.code === 'SESION') { store('sl_token', null); loginView(); return; }
    APP.innerHTML = '<div class="center" style="padding-top:120px"><div style="font-size:40px">📡</div><h3>No se pudo conectar</h3><p class="small mut">' + esc(err.message) + '</p><button class="btn p" onclick="location.reload()">Reintentar</button></div>';
  });
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
