<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Setup Lab">
<title>Setup Lab · Carcross</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #09090c; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #09090c; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #09090c; color: #a1a1aa;
            font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; transition: opacity .35s; z-index: 2; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; display: block; margin: 0 auto 16px; box-shadow: 0 12px 40px rgba(255,45,120,.35); }
  #splash .bar { width: 120px; height: 3px; margin: 14px auto 0; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg,#ff2d78,#a855f7); animation: sl 1.1s ease-in-out infinite; }
  @keyframes sl { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  #splash.off { opacity: 0; pointer-events: none; }
  #err { display: none; margin-top: 14px; max-width: 280px; text-align: center; color: #fcd34d; font-weight: 500; line-height: 1.4; }
  #err button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 12px; background: #ff2d78; color: #fff; font: 700 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="splash"><div style="text-align:center"><img src="icon-192.png" alt=""><div>Setup Lab</div><div class="bar"><i></i></div>
  <div id="err">Tarda más de lo normal. Comprueba la conexión.<br><button onclick="location.reload()">Reintentar</button></div></div></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyN-dOeuhP7i1T6mT2VgjAwZkB8GA-kf26vF6m9TevxIsWsRAioFdApzN5bUv6dNZWW/exec" title="Setup Lab"
  allow="clipboard-read; clipboard-write; fullscreen; geolocation; web-share" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  var sp = document.getElementById('splash'), fr = document.getElementById('app');
  fr.addEventListener('load', function () { sp.classList.add('off'); });
  setTimeout(function () { if (!sp.classList.contains('off')) document.getElementById('err').style.display = 'block'; }, 15000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
